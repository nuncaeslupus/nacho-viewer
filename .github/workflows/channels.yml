name: channels

# Puts a published Release into the Homebrew tap, winget, the apt repo and the Snap Store (S-4
# T8-T11). release.yml's `publish` dispatches it for stable tags only: a Release published with
# GITHUB_TOKEN triggers no `release` run. Rerun by hand with `gh workflow run channels.yml -f tag=vX.Y.Z`.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true

concurrency:
  group: channels-${{ inputs.tag }}

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ inputs.tag }}

jobs:
  homebrew:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Asset names change with the product name: match them, never spell them.
      - run: gh release download "$TAG" --pattern '*.dmg' --dir release
      - env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          dmg=$(ls release/*.dmg)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/nuncaeslupus/homebrew-tap" tap
          mkdir -p tap/Casks
          sed -e "s|@VERSION@|${TAG#v}|" -e "s|@SHA256@|$(sha256sum "$dmg" | cut -d' ' -f1)|" \
            -e "s|@DMG@|$(basename "$dmg")|" packaging/homebrew/nacho-viewer.rb >tap/Casks/nacho-viewer.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nacho-viewer.rb
          git diff --cached --quiet || { git commit -m "nacho-viewer ${TAG#v}" && git push; }

  apt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # pages.yml pushes to gh-pages too.
    concurrency:
      group: gh-pages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: gh release download "$TAG" --pattern '*.deb' --dir release
      - env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: gpg --batch --import <<<"$APT_GPG_PRIVATE_KEY"
      # The repo lives on gh-pages; the first run creates the branch. Not `site`: that is the page source.
      - run: |
          if git fetch --depth 1 origin gh-pages; then
            git worktree add pages FETCH_HEAD
            git -C pages switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          bash scripts/apt_repo.sh release/*.deb pages
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "apt: nacho-viewer ${TAG#v}" && git push origin gh-pages; }

  # Komac opens a PR to microsoft/winget-pkgs from WINGET_TOKEN's fork. It can only add a
  # version: the first one is made by hand with `komac new` (packaging/winget/README.md).
  winget:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - run: |
          if ! gh api repos/microsoft/winget-pkgs/contents/manifests/n/nuncaeslupus/NachoViewer --silent; then
            echo "::notice::nuncaeslupus.NachoViewer is not in winget-pkgs yet; submit it with komac new first"
            exit 0
          fi
          gh release download v2.17.1 --repo russellbanks/Komac --pattern 'komac_2.17.1-1_amd64.deb'
          sudo apt-get install -y ./komac_2.17.1-1_amd64.deb
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          urls=$(gh release view "$TAG" --json assets -q '.assets[].name | select(test("(\\.msi|-setup\\.exe)$"))' | sed "s|^|$base/|")
          GITHUB_TOKEN="$WINGET_TOKEN" komac update nuncaeslupus.NachoViewer --version "${TAG#v}" --urls $urls --submit
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  snap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          gh release download "$TAG" --pattern '*.deb' --dir release
          mv release/*.deb nacho-viewer.deb
      - id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
      - uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
