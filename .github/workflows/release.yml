name: release

# A `v*` tag builds every OS's bundles into one draft Release (S-4 T1). Each build job then installs
# its own bundle and smoke-tests it (T2); `publish` un-drafts the Release only after all of them pass. Bundles are unsigned for now (D-24); macOS is ad-hoc
# signed (`signingIdentity "-"`) so Apple Silicon runs it.
# tag.yml dispatches it on the tag it pushes: a tag pushed with GITHUB_TOKEN triggers no `push` run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  # One draft created up front, so the parallel builds upload into it instead of racing to create it.
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/check_release.sh --version-only "$GITHUB_REF_NAME"
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=true
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Nacho Viewer $GITHUB_REF_NAME" -F draft=true -F prerelease="$prerelease" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles msi,nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # linuxdeploy is itself an AppImage; the runner has no libfuse2, so extract it instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: 1
      # With CI=true Tauri skips the Finder step that lays out the dmg window (background, icons).
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Same apt workaround as ci.yml: man-db's trigger can stall apt on ubuntu-24.04 runners.
      - if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          args: ${{ matrix.args }}
      # Install smoke (T2): install the bundle just built, open the README with it, and require the
      # app to be alive at 10 s (scripts/smoke.sh).
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          xvfb-run -a bash scripts/smoke.sh nacho-viewer README.md
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)[0].FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited $($p.ExitCode)" }
      - if: runner.os == 'Windows'
        run: bash scripts/smoke.sh "/c/Program Files/Nacho Viewer/nacho-viewer.exe" README.md
        shell: bash
      - if: runner.os == 'macOS'
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/nacho-viewer-dmg src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          cp -R "/tmp/nacho-viewer-dmg/Nacho Viewer.app" /Applications/
          hdiutil detach /tmp/nacho-viewer-dmg
          bash scripts/smoke.sh "/Applications/Nacho Viewer.app/Contents/MacOS/nacho-viewer" README.md

  # Fails when any bundle is missing; the size table goes to the job summary.
  assets:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_release.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

  # Every bundle is present and every install smoke passed: the Release goes public.
  # A stable tag then goes to the stores (channels.yml); a pre-release stays on GitHub.
  publish:
    needs: [draft, assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.release-id }}" -F draft=false --jq .html_url
      - if: ${{ !contains(github.ref_name, '-') }}
        run: gh workflow run channels.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$GITHUB_REF_NAME"
