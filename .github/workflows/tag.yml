name: tag

# A merge to main that bumps the version in tauri.conf.json tags it as v<version> and starts the
# release. Run it by hand (Actions → tag → Run workflow) to push a given tag, e.g. v0.1.0-rc.1.
on:
  push:
    branches: [main]
    paths: ['src-tauri/tauri.conf.json']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to push, e.g. v0.1.0-rc.1 (must match the configs' version)
        required: true

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            version() { sed -n 's/^  "version": "\(.*\)",$/\1/p'; }
            new=$(version < src-tauri/tauri.conf.json)
            old=$(git show "$BEFORE:src-tauri/tauri.conf.json" 2>/dev/null | version || true)
            if [ "$new" = "$old" ] || git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
              echo "version $new unchanged or already tagged; nothing to do"
              exit 0
            fi
            TAG=v$new
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"
            exit 1
          fi
          bash scripts/check_release.sh --version-only "$TAG"
          git tag "$TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"
