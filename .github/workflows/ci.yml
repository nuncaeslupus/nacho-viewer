name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What a pull request touches decides which jobs run; a skipped job still reports as passed, so
  # required checks keep working. A push to main runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      native: ${{ steps.files.outputs.native }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\nnative=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          # Docs, status notes, the site and the arsenal are inputs to no job below.
          grep -qvE '^(docs|status|site|arsenal|claude-arsenal)/|\.md$' <<<"$files" && code=true || code=false
          # Installers and the cross-platform export tests only depend on the core and packaging.
          grep -qE '^(src-tauri|packaging)/|^package(-lock)?\.json$|^\.github/workflows/ci\.yml$' <<<"$files" && native=true || native=false
          printf 'code=%s\nnative=%s\n' "$code" "$native" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # man-db's trigger can stall apt on ubuntu-24.04 runners, and the mirror is sometimes slow.
      # ponytail: no apt cache; cache-apt-pkgs-action drops the -dev .so links and linking fails.
      - timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: make lint test

  # Separate from `check` so packaging (a release build plus linuxdeploy) never slows the lint/test feedback.
  # Also on frontend changes: the bundle embeds the frontend, so it can grow the .deb.
  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # linuxdeploy is itself an AppImage; the runner has no libfuse2, so extract it instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same apt workaround as `check`: man-db's trigger can stall apt on ubuntu-24.04 runners.
      - timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: package
      - run: npm ci
      # ponytail: the AppImage step downloads linuxdeploy and its plugin from GitHub releases on every
      # run and bundles WebKitGTK (~80 MB), so it is the slow, network-dependent part of this job.
      # It is built and its size reported, not gated (spec: `.deb` is the gated package).
      - timeout-minutes: 30
        # Updater signing needs the private key, which only the release workflow gets.
        run: npm run tauri build -- --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Package sizes (fails when the .deb exceeds 20 MB)
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          # Exactly one .deb, so the size check below can never compare an empty or multi-word value.
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .deb, found ${#debs[@]}: ${debs[*]}"
            exit 1
          fi
          if [ "${#appimages[@]}" -gt 1 ]; then
            echo "::error::expected at most one AppImage, found ${#appimages[@]}: ${appimages[*]}"
            exit 1
          fi
          deb=${debs[0]}
          deb_bytes=$(stat -c %s "$deb")
          limit=$((20 * 1024 * 1024))
          deb_mb=$(awk "BEGIN { printf \"%.2f\", $deb_bytes / 1048576 }")
          echo "deb_package_mb=$deb_mb (limit 20)"
          {
            echo "| package | MB |"
            echo "|---|---|"
            echo "| \`$(basename "$deb")\` | $deb_mb (limit 20) |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#appimages[@]}" -eq 1 ]; then
            appimage=${appimages[0]}
            appimage_mb=$(awk "BEGIN { printf \"%.2f\", $(stat -c %s "$appimage") / 1048576 }")
            echo "appimage_mb=$appimage_mb (reported, not gated)"
            echo "| \`$(basename "$appimage")\` | $appimage_mb |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$deb_bytes" -gt "$limit" ]; then
            echo "::error::.deb is $deb_mb MB, over the 20 MB limit"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  # Export on Windows (S-4 T4) prints through WebView2: build that path and run the Rust tests there (path, scope and export).
  windows:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: windows
      - run: npm ci
      # generate_context! reads the frontend bundle.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
      # An installer to check the PDF export by hand on Windows; built on main, not on every PR push.
      - if: github.event_name == 'push'
        run: npm run tauri build -- --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

  # Export on macOS (S-4 T5) prints through WKWebView: build that path and run the Rust tests there (path, scope and export).
  macos:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: macos
      - run: npm ci
      # generate_context! reads the frontend bundle.
      - run: npm run build
      - run: cargo test
        working-directory: src-tauri
      # A disk image to check the PDF export by hand on macOS; built on main, not on every PR push.
      - if: github.event_name == 'push'
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'
        # As in release.yml: keep Tauri's Finder step that lays out the dmg window.
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-installer
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

  # The render pipeline in real browsers: WebKit (the app's engine family) and Chromium.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Browsers and their system deps come preinstalled, so this job never touches the slow apt mirror.
    # The tag must match the @playwright/test version pinned in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # Playwright's Docker guidance: Chromium needs the host's IPC/shared memory to run at speed.
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # playwright's webServer builds the frontend itself; `check` runs the typecheck.
      - run: npm run test:e2e
