[package]
name = "nacho-viewer"
version = "0.1.2"
description = "A Markdown viewer that reads like a well-typeset document"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
dunce = "1"
notify-debouncer-mini = "0.7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"

# Export prints through WebKitGTK; the versions Tauri already links.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
lopdf = { version = "0.46.0", default-features = false }
webkit2gtk = "2.0"

# Export prints through WebView2 on Windows; the versions Tauri already links.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

# Export prints through WKWebView on macOS; the versions Tauri already links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView"] }

[dev-dependencies]
tempfile = "3"
