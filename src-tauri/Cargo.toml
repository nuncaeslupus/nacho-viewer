[package]
name = "nacho-viewer"
version = "0.1.0"
description = "A Markdown viewer that reads like a well-typeset document"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
dunce = "1"
notify-debouncer-mini = "0.7"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
url = "2"

# Export prints through WebKitGTK; the versions Tauri already links.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
lopdf = { version = "0.46.0", default-features = false }
webkit2gtk = "2.0"

# Export prints through WebView2 on Windows; the versions Tauri already links.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
