<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The runtime's fontconfig reads host .woff fonts (e.g. Ubuntu's fonts-ebgaramond) without a
     family name, and WebKit's Skia then loops forever listing families: a grey window. -->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
